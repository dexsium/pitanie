name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Системная библиотека SQLite для тестов
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Подготовка проекта
        run: bash tool/prepare.sh
      - name: Анализ
        run: flutter analyze --no-fatal-infos
      - name: Тесты
        run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: bash tool/prepare.sh
      - name: "Сборка APK, до 3 попыток (загрузка NDK иногда обрывается)"
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Попытка $i не удалась, повтор"
            rm -rf "$ANDROID_HOME/ndk" || true
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: pitanie-apk
          path: build/app/outputs/flutter-apk/app-release.apk
