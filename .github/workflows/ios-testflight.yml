name: iOS → TestFlight

# Подписанная сборка и автоматическая загрузка в TestFlight.
# Запускается при пуше в main и вручную. Номер сборки = номер запуска workflow,
# поэтому он всегда растёт. Секреты репозитория в журнал не выводятся:
#   IOS_P12_BASE64, IOS_P12_PASSWORD  сертификат Apple Distribution
#   IOS_PROFILE_BASE64                профиль App Store для com.pitanie.pitanie
#   ASC_KEY_BASE64, ASC_KEY_ID, ASC_ISSUER_ID  ключ App Store Connect API
# Необязательный секрет IOS_WIDGET_PROFILE_BASE64 (профиль App Store для com.pitanie.pitanie.widget)
# включает виджет iOS: без него сборка идёт как раньше. Подробности в docs/STAGE_WIDGETS.md.
# Запуск из форков и pull request намеренно не предусмотрен: секреты не должны
# попадать в чужой код.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: 'Загрузить сборку в TestFlight'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  TEAM_ID: JXT3PLNP7F
  BUNDLE_ID: com.pitanie.pitanie

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов (значения не печатаются)
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          missing=0
          for v in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_PROFILE_BASE64 ASC_KEY_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "$(printenv $v)" ]; then echo "НЕ ЗАДАН СЕКРЕТ: $v"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Подготовка проекта (платформы, Drift, разрешения)
        run: bash tool/prepare.sh

      - name: Сертификат и профиль
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          set -e
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPASS="$(uuidgen)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          printenv IOS_P12_BASE64 | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printenv IOS_PROFILE_BASE64 | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PUUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          PNAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PUUID.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          echo "профиль: $PNAME"
          security find-identity -v -p codesigning "$KC"
          echo "PROFILE_NAME=$PNAME" >> "$GITHUB_ENV"
          if [ -n "${IOS_WIDGET_PROFILE_BASE64:-}" ]; then
            printenv IOS_WIDGET_PROFILE_BASE64 | base64 --decode > "$RUNNER_TEMP/wprofile.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/wprofile.mobileprovision" > "$RUNNER_TEMP/wprofile.plist"
            WUUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/wprofile.plist")"
            WNAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/wprofile.plist")"
            cp "$RUNNER_TEMP/wprofile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$WUUID.mobileprovision"
            rm -f "$RUNNER_TEMP/wprofile.mobileprovision" "$RUNNER_TEMP/wprofile.plist"
            echo "профиль виджета: $WNAME"
            echo "WIDGET_PROFILE_NAME=$WNAME" >> "$GITHUB_ENV"
          fi

      - name: Расширение виджета iOS (только если задан профиль виджета)
        if: env.WIDGET_PROFILE_NAME != ''
        run: ruby tool/ios_widget/add_widget_target.rb

      - name: Ручная подпись App Store для цели Runner
        run: |
          set -e
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            target = proj.targets.find { |t| t.name == "Runner" }
            target.build_configurations.each do |c|
              s = c.build_settings
              s["CODE_SIGN_STYLE"] = "Manual"
              s["DEVELOPMENT_TEAM"] = ENV["TEAM_ID"]
              s["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_NAME"]
              s["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              s["CODE_SIGN_ENTITLEMENTS"] = "Runner/Runner.entitlements"
              s.delete("CODE_SIGN_IDENTITY[sdk=iphoneos*]")
            end
            proj.save
          '
          WIDGET_ENTRY=""
          if [ -n "${WIDGET_PROFILE_NAME:-}" ]; then
            WIDGET_ENTRY="<key>${BUNDLE_ID}.widget</key><string>${WIDGET_PROFILE_NAME}</string>"
          fi
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>${WIDGET_ENTRY}</dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Сборка подписанного IPA
        run: |
          flutter build ipa --release --build-number="$GITHUB_RUN_NUMBER" \
            --export-options-plist="$PWD/ios/ExportOptions.plist"
          IPA="$(ls build/ios/ipa/*.ipa | head -1)"
          cp "$IPA" pitanie-signed.ipa
          ls -la pitanie-signed.ipa

      - name: Проверка нативной рекламы Яндекса в сборке
        run: |
          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          strings "$APP/Runner" | grep -q "pitanie/native_ad" || { echo "в сборке нет представления pitanie/native_ad"; exit 1; }
          strings "$APP/Runner" | grep -q "YandexMobileAds" || { echo "в сборке нет Yandex Mobile Ads SDK"; exit 1; }

      - name: Проверка расширения виджета в сборке
        if: env.WIDGET_PROFILE_NAME != ''
        run: |
          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          ls "$APP/PlugIns" || true
          test -d "$APP/PlugIns/PitanieWidget.appex" || { echo "в сборке нет PitanieWidget.appex"; exit 1; }

      - name: Проверка права на HealthKit в подписанном приложении
        run: |
          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$RUNNER_TEMP/entitlements.txt"
          grep -q "com.apple.developer.healthkit" "$RUNNER_TEMP/entitlements.txt" || { echo "в приложении нет HealthKit"; exit 1; }

      - name: Загрузка в TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printenv ASC_KEY_BASE64 | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if xcrun altool --upload-app --type ios --file pitanie-signed.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"; then
            echo "загружено через altool"
          else
            echo "altool не справился, пробуем iTMSTransporter"
            xcrun iTMSTransporter -m upload -assetFile pitanie-signed.ipa -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID" -v informational
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
