name: pitanie_native_ads
description: Нативная реклама Яндекса (РСЯ) для iOS через официальный Yandex Mobile Ads SDK 8 (PlatformView). Только iOS.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PitanieNativeAdsPlugin
