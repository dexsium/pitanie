name: pitanie
description: Дневник питания, воды и физической активности
publish_to: none
version: 1.19.21+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  # Локальный плагин iOS: статус доступа часов к уведомлениям (ANCS). Папка ios/ в git не хранится,
  # поэтому нативный код лежит в плагине, а не в AppDelegate.
  watch_ancs:
    path: packages/watch_ancs
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: any
  fl_chart: ^0.69.0
  health: ^13.3.1
  mobile_scanner: ^7.5.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.1
  pdf: ^3.11.3
  printing: ^5.14.2
  file_picker: ^13.3.2
  sqlite3: ^2.4.6
  crypto: ^3.0.5
  flutter_blue_plus: 2.3.14
  flutter_secure_storage: ^11.2.0
  pointycastle: ^4.0.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/catalog.sqlite
    - assets/catalog/import_report.json
    - assets/profile/avatar.png
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/profile/watch.png
    - assets/profile/scale.png
    - assets/dashboard/watch_card.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
